<body>
  <h2>Cálculo de Desconto Salarial</h2>
  <form id="formDesconto">
    <label>
      Retribuição Mensal (€): 
      <input type="number" id="retribuicaoMensal" required>
    </label>
    <br><br>

    <label>
      Nº de dias em falta: 
      <input type="number" id="diasFalta" required>
    </label>
    <br><br>

    <label>
      Regime:
      <select id="regime">
        <option value="publico">Público (35h)</option>
        <option value="privado">Privado (40h)</option>
      </select>
    </label>
    <br><br>

    <button type="submit">Calcular</button>
  </form>

  <h3>Resultado:</h3>
  <pre id="resultado"></pre>

  <script>
    function calcularDesconto(diasFalta, retribuicaoMensal, regime) {
      const horasSemanais = regime === "publico" ? 35 : 40;
      const horasDia = 7;

      const valorHora = (retribuicaoMensal * 12) / (52 * horasSemanais);
      const valorDia = valorHora * horasDia;

      const descontoRetribuicao = valorDia * diasFalta;
      const salarioFinal = retribuicaoMensal - descontoRetribuicao;

      return {
        salario_base: Number(retribuicaoMensal.toFixed(2)),
        valor_hora: Number(valorHora.toFixed(2)),
        valor_dia: Number(valorDia.toFixed(2)),
        desconto_retribuicao: Number(descontoRetribuicao.toFixed(2)),
        salario_final: Number(salarioFinal.toFixed(2))
      };
    }

    document.getElementById("formDesconto").addEventListener("submit", function (e) {
      e.preventDefault();

      const retribuicaoMensal = parseFloat(document.getElementById("retribuicaoMensal").value);
      const diasFalta = parseInt(document.getElementById("diasFalta").value, 10);
      const regime = document.getElementById("regime").value;

      const resultado = calcularDesconto(diasFalta, retribuicaoMensal, regime);

      let output = "";
      for (const [key, value] of Object.entries(resultado)) {
        output += `${key}: ${value} €\n`;
      }

      document.getElementById("resultado").textContent = output;
    });
  </script>
